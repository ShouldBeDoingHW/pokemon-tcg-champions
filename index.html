<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon TCG Champions — TCG Arena</title><style>body{font:16px system-ui,sans-serif;line-height:1.6;max-width:660px;margin:12vh auto;padding:0 24px;color:#203040}a{color:#1263be}button{border:0;border-radius:8px;color:white;background:#1f67ae;padding:12px 20px;font-size:17px;cursor:pointer}</style><h1>Pokémon TCG Champions</h1><p>Academy + Roaring Skies combined collection for TCG Arena.</p><button id="open">Open in TCG Arena</button><p id="url"></p><script>const target=new URL('game.json',location.href).href;const bytes=new TextEncoder().encode(target);let binary='';bytes.forEach(x=>binary+=String.fromCharCode(x));const link='https://tcg-arena.fr/load/'+btoa(binary);document.getElementById('open').onclick=()=>location.href=link;document.getElementById('url').textContent='Game file: '+target;</script></html>
